    turn.appendChild(bubble);

    if (resp.correlation_id) turn.appendChild(el("div", "meta", "ref " + resp.correlation_id));

    // Week 2: the graph's handoff trail — collapsed "how this answer was
    // assembled" (route → node with latency). Free-text reason renders here
    // only (UI/trace surface; it never reaches logs).
    if (Array.isArray(resp.handoffs) && resp.handoffs.length) {
      turn.appendChild(buildHandoffTrail(resp.handoffs));
    }

    if (Array.isArray(resp.action_chips) && resp.action_chips.length) {
      const cw = el("div", "achips");
      resp.action_chips.forEach(ch => {
        const b = el("button", "chip");
        b.type = "button";
        b.textContent = ch.label || ch.intent || "Action";
        b.addEventListener("click", () => {
          if (busy) return;
          sendTurn({ kind: "chip", intent: ch.intent, params: ch.params || {}, echo: ch.label || ch.intent });
        });
        cw.appendChild(b);
      });
      turn.appendChild(cw);
    }

    if (node && node.parentNode) transcript.replaceChild(turn, node);
    else transcript.appendChild(turn);
    scrollTranscript();
  }

  // T5: chart card rendered from GET /labs/trend alongside the /chat answer.
  // Charts only series with >=2 numeric points; caps at the 3 most recently
  // active tests. Every latest point keeps its procedure_result cite pill —
  // the chart shows nothing the physician cannot trace to a row.
  function renderLabTrendCard(data) {
    if (!data || !data.series) return null;
    const entries = Object.keys(data.series).map(name => {
      const pts = (data.series[name] || []).filter(p => isFinite(numify(p.value)));
      return { name: name, pts: pts, latest: pts.length ? (pts[pts.length - 1].date || "") : "" };
    }).filter(e => e.pts.length >= 2);
    if (!entries.length) return null;
    entries.sort((a, b) => b.latest < a.latest ? -1 : b.latest > a.latest ? 1 : 0);

    const turn = el("div", "turn assistant trend-turn");
    const card = el("div", "bubble trend-card");
    card.appendChild(el("div", "trend-title", "📈 Lab trends" + (data.truncated ? " (older results not shown)" : "")));

    entries.slice(0, 3).forEach(e => {
      const sec = el("div", "trend-sec");
      sec.appendChild(el("div", "trend-name", e.name));
      const chart = trendChart(e.pts);
      if (chart) sec.appendChild(chart);

      // expandable history table (same hist-row pattern as the metric cards)
      const det = document.createElement("details");
      det.className = "trend-hist";
      const sum = document.createElement("summary");
      sum.appendChild(el("span", "tw", "›"));
      sum.appendChild(el("span", null, "History · " + e.pts.length + " results"));
      det.appendChild(sum);
      e.pts.slice().reverse().forEach(p => {
        const r = el("div", "hist-row");
        r.appendChild(el("span", null, p.date || "—"));
        const hv = el("span", "hv" + (p.abnormal ? " ab" : ""));
        hv.textContent = (p.value || "—") + (p.units ? " " + p.units : "");
        r.appendChild(hv);
        det.appendChild(r);
      });
      sec.appendChild(det);

      const cite = makeCite(e.pts[e.pts.length - 1].source);
      if (cite) { const cw = el("div", "cites trend-cite"); cw.appendChild(cite); sec.appendChild(cw); }
      card.appendChild(sec);
    });

    turn.appendChild(card);
    return turn;
  }

  function buildHandoffTrail(handoffs) {
    const det = document.createElement("details");
    det.className = "handoffs";
    const sum = document.createElement("summary");
    const tw = el("span", "tw", "›");
    sum.appendChild(tw);
    sum.appendChild(el("span", null,
      "How this answer was assembled · " + handoffs.length + " step" + (handoffs.length === 1 ? "" : "s")));
    det.appendChild(sum);
    const hops = el("div", "hops");
    handoffs.slice().sort((a, b) => (a.seq || 0) - (b.seq || 0)).forEach(h => {
      const row = el("div", "hop");
      row.appendChild(el("span", "seq", String((h.seq != null ? h.seq : 0) + 1) + "."));
      row.appendChild(el("span", "path",
        (h.from_node || "?").replace(/_/g, " ") + " → " + (h.to_node || "?").replace(/_/g, " ")));
      if (h.route) row.appendChild(el("span", "route", h.route.replace(/^route_to_/, "").replace(/_/g, " ")));
      if (h.latency_ms != null) row.appendChild(el("span", "ms", Math.round(h.latency_ms) + " ms"));
      if (h.reason) row.appendChild(el("span", "why", h.reason));
      hops.appendChild(row);
    });
    det.appendChild(hops);
    return det;
  }

  function summarize(resp) {
    const parts = [];
    if (Array.isArray(resp.briefing)) resp.briefing.forEach(c => { if (c.text) parts.push(c.text); });
    if (Array.isArray(resp.constraint_flags)) resp.constraint_flags.forEach(f => { if (f.message) parts.push("[" + (f.severity || "info") + "] " + f.message); });
    if (resp.notes) parts.push(resp.notes);
    return parts.join(" ") || "(no verified content)";
  }

  // ================= NETWORK =================
  function authHeaders(json, useDay) {
    // /day spans the provider's whole schedule, so it needs the day-scoped
    // token; every patient call uses the patient token.
    const tok = (useDay && DAY_TOKEN) ? DAY_TOKEN : TOKEN;
    const h = { "Authorization": "Bearer " + tok };
    if (json) h["Content-Type"] = "application/json";
    return h;
  }
  function humanError(status) {
    if (status === 401) return "Session not authorized — reopen from the OpenEMR chart.";
    if (status === 403) return "Not authorized for this patient (403).";
    if (status === 429) return "Too many requests (429). Pause a moment and try again.";
    if (status === 404) return "Not found (404).";
    if (status === 400) return "The request could not be processed (400).";
    if (status >= 500) return "The Co-Pilot service had a problem (" + status + "). Try again shortly.";
    return "Request failed (" + status + ").";
  }

  function setEnabled(on) {
    input.disabled = !on; send.disabled = !on;
    const clipBtn = document.getElementById("clip");
    if (clipBtn) clipBtn.disabled = !on;
    document.querySelectorAll("#starters .chip, .achips .chip, .attach-go").forEach(b => { b.disabled = !on; });
  }

  function trimmedHistory() { return history.slice(-MAX_HISTORY).map(h => ({ role: h.role, text: h.text })); }

  async function sendTurn(opts) {
    if (busy) return;
    busy = true; setEnabled(false);
    starters.innerHTML = "";

    const body = { pid: currentPid, history: trimmedHistory() };
    let echo;
    if (opts.kind === "chip") { body.chip_intent = opts.intent; body.chip_params = opts.params || {}; echo = opts.echo || opts.intent; }
    else { body.message = opts.message; echo = opts.message; }

    renderUser(echo);
    history.push({ role: "user", text: echo });
    const node = makeLoading();

    // T5: the lab_trend chip also fetches the deterministic /labs/trend series
    // in PARALLEL with /chat. The chart card AUGMENTS the text answer — any
    // trend failure degrades silently to text-only (never blocks the turn).
    let trendReq = null;
    if (opts.kind === "chip" && opts.intent === "lab_trend") {
      trendReq = fetch("/labs/trend?pid=" + encodeURIComponent(currentPid), { headers: authHeaders(false) })
        .then(r => (r.ok ? r.json() : null))
        .catch(() => null);
    }

    try {
      const res = await fetch("/chat", { method: "POST", headers: authHeaders(true), body: JSON.stringify(body) });
      if (!res.ok) {
        renderError(humanError(res.status), node);
      } else {
        const data = await res.json();
        renderAssistant(data, node);
        history.push({ role: "assistant", text: summarize(data) });
        if (trendReq) {
          const trend = await trendReq;
          const card = trend && renderLabTrendCard(trend);
          if (card) { transcript.appendChild(card); scrollTranscript(); }
        }
      }
    } catch (e) {
      renderError("Could not reach the Co-Pilot service. Check your connection and try again.", node);
    } finally {
      busy = false; setEnabled(true); input.focus();
    }
  }

  async function loadSnapshot() {
    snapshot = null;
    skeletonHeader();
    skeletonDashboard();
    try {
      const res = await fetch("/snapshot?pid=" + encodeURIComponent(currentPid), { headers: authHeaders(false) });
      if (!res.ok) {
        renderHeader(null);
        dash.innerHTML = "";
        if (res.status === 403 || res.status === 404) {
          // Friendly guidance instead of a dead panel: steer to the schedule.
          const wrap = el("div", "inline-err");
          wrap.appendChild(el("div", null,
            "This patient isn't available to you (not found or not on your panel)."));
          const btn = el("button", "chip");
          btn.type = "button";
          btn.textContent = "Open My Day to pick a patient";
          btn.style.marginTop = "8px";
          btn.addEventListener("click", () => selectTab("day"));
          wrap.appendChild(btn);
          dash.appendChild(wrap);
        } else {
          dash.appendChild(el("div", "inline-err", humanError(res.status)));
        }
        renderStarters();
        return;
      }
      const data = await res.json();
      snapshot = data;
      renderHeader(data);
      renderDashboard(data);
      updateLaunchBadge(data);
      renderStarters();
    } catch (e) {
      renderHeader(null);
      dash.innerHTML = "";
      dash.appendChild(el("div", "inline-err", "Could not load the patient snapshot. Check your connection and try again."));
      renderStarters();
    }
  }

  function resetConversation() {
    history = [];
    transcript.innerHTML = "";
    renderStarters();
  }

  // ================= MY DAY =================
  function skeletonDay() {
    dayBar.innerHTML = "";
    const d = el("div", "sk sk-line"); d.style.width = "180px"; d.style.height = "18px";
    dayBar.appendChild(d);
    dayScroll.innerHTML = "";
    for (let i = 0; i < 4; i++) {
      const a = el("div", "appt");
      const s = el("div", "sk sk-line"); s.style.width = "100%"; s.style.margin = "6px 0";
      a.appendChild(s);
      dayScroll.appendChild(a);
    }
  }

  async function loadDay(force) {
    if (dayLoaded && !force) return;
    skeletonDay();
    try {
      const res = await fetch("/day?date=" + localISODate(), { headers: authHeaders(false, true) });
      if (!res.ok) { renderDayError(humanError(res.status)); return; }
      const data = await res.json();
      dayLoaded = true;
      renderDay(data);
    } catch (e) {
      renderDayError("Could not load today's schedule. Check your connection and try again.");
    }
  }
  function renderDayError(msg) {
    dayBar.innerHTML = "";
    dayBar.appendChild(el("div", "day-date", "My Day"));
    dayScroll.innerHTML = "";
    dayScroll.appendChild(el("div", "inline-err", msg));
  }

  function prettyDate(iso) {
    if (!iso) return "Today";
    const d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return iso;
    return d.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });
  }

  function renderDay(data) {
    const appts = data.appointments || [];
    let crit = 0, warn = 0;
    appts.forEach(a => {
      const f = a.flags || {};
      if (f.critical) crit += f.critical; if (f.warning) warn += f.warning;
    });

    dayBar.innerHTML = "";
    dayBar.appendChild(el("div", "day-date", prettyDate(data.date)));
    const sub = el("div", "day-sub");
    sub.appendChild(el("span", "count", (data.count != null ? data.count : appts.length) + " patient" + ((data.count === 1) ? "" : "s") + " today"));
    if (crit) { const p = el("span", "flagdot crit"); p.appendChild(el("span", "d")); p.appendChild(el("span", null, crit + " critical")); sub.appendChild(p); }
    if (warn) { const p = el("span", "flagdot warn"); p.appendChild(el("span", "d")); p.appendChild(el("span", null, warn + " warning")); sub.appendChild(p); }
    dayBar.appendChild(sub);
    if (data.degraded) dayBar.appendChild(el("div", "notes-line", data.notes || "Partial schedule — some data unavailable"));

    dayScroll.innerHTML = "";
    if (!appts.length) {
      const s = el("div", "state");
      const big = el("div", "big"); big.appendChild(svgIcon(ICONS.problem, 1.7));
      s.appendChild(big);
      s.appendChild(el("h3", null, "No appointments for today."));
      s.appendChild(el("p", null, "When your schedule fills in, patients appear here — flagged ones first."));
      dayScroll.appendChild(s);
      return;
    }

    appts.forEach(a => {
      const f = a.flags || {};
      const flagged = !!(f.critical || f.warning);
      const critOnly = !!f.critical;
      const btn = el("button", "appt" + (flagged ? " flagged" : "") + (flagged && !critOnly ? " warn-only" : ""));
      btn.type = "button";
      btn.appendChild(el("span", "time", a.time || "—"));

      const who = el("div", "who");
      const demo = a.demographics || {};
      who.appendChild(el("div", "nm", demo.name || ("Patient " + a.pid)));
      const bits = [];
      if (demo.age != null) bits.push(demo.age + "y");
      if (demo.sex) bits.push(demo.sex);
      const rs = a.reason ? a.reason : "";
      who.appendChild(el("div", "rs", (bits.length ? bits.join(" · ") + (rs ? " · " : "") : "") + rs));
      btn.appendChild(who);

      const right = el("div", "right");
      if (a.changed_recently) right.appendChild(el("span", "changed", "changed"));
      if (f.critical) { const fd = el("span", "flagdot crit"); fd.appendChild(el("span", "d")); fd.appendChild(el("span", null, String(f.critical))); right.appendChild(fd); }
      else if (f.warning) { const fd = el("span", "flagdot warn"); fd.appendChild(el("span", "d")); fd.appendChild(el("span", null, String(f.warning))); right.appendChild(fd); }
      btn.appendChild(right);

      btn.addEventListener("click", () => {
        if (EMR_HANDOFF) {
          // In-EMR schedule: open the patient's REAL chart (the wrapper page,
          // same-origin with OpenEMR, performs the tab navigation). The chart's
          // own Co-Pilot is auto-scoped, so panel and patient always match.
          try { parent.postMessage({ copilot: "open_patient", pid: a.pid }, "*"); } catch (e) {}
          return;
        }
        currentPid = a.pid;
        if (!LOCKED) { /* header input re-rendered by loadSnapshot */ }
        selectTab("patient");
        resetConversation();
        loadSnapshot();
      });
      dayScroll.appendChild(btn);
    });
  }

  // ================= TABS =================
  const tabPatient = $("tab-patient"), tabDay = $("tab-day");
  const viewPatient = $("view-patient"), viewDay = $("view-day");
  function selectTab(which) {
    const patient = which === "patient";
    tabPatient.setAttribute("aria-selected", patient ? "true" : "false");
    tabDay.setAttribute("aria-selected", patient ? "false" : "true");
    viewPatient.classList.toggle("active", patient);
    viewDay.classList.toggle("active", !patient);
    if (!patient) loadDay(false);
    if (patient && !snapshot) loadSnapshot();   // lazy: never show an empty patient view
  }
  tabPatient.addEventListener("click", () => selectTab("patient"));
  tabDay.addEventListener("click", () => selectTab("day"));

  // ================= COMPOSER =================
  function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; }
  composer.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text || busy) return;
    input.value = ""; autoGrow();
    sendTurn({ kind: "text", message: text });
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); composer.requestSubmit(); }
  });
  input.addEventListener("input", autoGrow);

  // ================= UPLOAD + INGEST (Week 2, D7) =================
  const clip = $("clip"), fileInput = $("file-input"), attachBar = $("attach-bar");
  let pendingFile = null;
  let pendingDocType = "lab_report";

  clip.addEventListener("click", () => { if (!busy) fileInput.click(); });
  fileInput.addEventListener("change", () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = "";
    if (!f) return;
    pendingFile = f;
    pendingDocType = /intake/i.test(f.name) ? "intake_form"
      : /med/i.test(f.name) ? "medication_list" : "lab_report";
    renderAttachBar();
  });

  function fmtSize(n) {
    if (!isFinite(n)) return "";
    if (n >= 1048576) return (n / 1048576).toFixed(1) + " MB";
    if (n >= 1024) return Math.round(n / 1024) + " KB";
    return n + " B";
  }
  function clearAttach() { pendingFile = null; renderAttachBar(); }
  function renderAttachBar() {
    if (!pendingFile) { attachBar.style.display = "none"; attachBar.innerHTML = ""; return; }
    attachBar.innerHTML = "";
    attachBar.style.display = "flex";
    attachBar.appendChild(el("span", null, "📎"));
    const nm = el("span", "attach-name", pendingFile.name);
    nm.title = pendingFile.name;
    attachBar.appendChild(nm);
    attachBar.appendChild(el("span", "attach-size", fmtSize(pendingFile.size)));
    const seg = el("div", "doct-seg");
    seg.setAttribute("role", "radiogroup");
    seg.setAttribute("aria-label", "Document type");
    [["lab_report", "Lab PDF"], ["intake_form", "Intake form"], ["medication_list", "Med list"]].forEach(([val, label]) => {
      const b = el("button", "doct" + (pendingDocType === val ? " on" : ""), label);
      b.type = "button";
      b.className = pendingDocType === val ? "on" : "";
      b.addEventListener("click", () => { pendingDocType = val; renderAttachBar(); });
      seg.appendChild(b);
    });
    attachBar.appendChild(seg);
    const actions = el("div", "attach-actions");
    const go = el("button", "attach-go", "Ingest");
    go.type = "button";
    go.addEventListener("click", doIngest);
    actions.appendChild(go);
    const x = el("button", "attach-x");
    x.type = "button"; x.title = "Remove attachment"; x.setAttribute("aria-label", "Remove attachment");
    x.appendChild(svgIcon('<path d="M18 6 6 18M6 6l12 12"/>', 2.4));
    x.addEventListener("click", clearAttach);
    actions.appendChild(x);
    attachBar.appendChild(actions);
  }

  function ingestHumanError(status) {
    if (status === 404) return "Document ingestion isn't enabled on this server.";
    if (status === 413) return "This file is too large to ingest. Try a smaller document.";
    if (status === 415) return "Unsupported file type — only PDF, PNG or JPG documents can be ingested.";
    if (status === 403) return "Not authorized to add documents for this patient (403).";
    if (status === 422) return "The upload was rejected (empty file or unknown document type).";
    return humanError(status);
  }

  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
  function humanizeFieldId(fid) {
    return String(fid).split(".").map(p => p.replace(/_/g, " ")).join(" — ");
  }
  // Backend gaps arrive as "field.sub: not_found" / "field.sub:
  // failed_verification (reason)". Render them in words — a gap is stated,
  // never silently absent, and never shown as data.
  function gapToWords(g) {
    const m = String(g).match(/^([\w.]+):\s*(not_found|failed_verification)\s*(?:\((.*)\))?$/);
    if (!m) return String(g);
    const field = cap(humanizeFieldId(m[1]));
    if (m[2] === "not_found") return field + " not found on the document — not recorded.";
    return field + " could not be verified against the document text" +
      (m[3] ? " (" + m[3] + ")" : "") + " — not recorded.";
  }

  function summarizeIngest(res) {
    if (res.deduplicated || res.status === "deduplicated") return "Document already on file — no new records.";
    if (res.status === "persisted")
      return "Document ingested: " + res.fields_extracted + " of " + res.fields_total + " fields recorded.";
    if (res.status === "needs_review") return "Scanned document — fields need review; nothing recorded automatically.";
    return "Document could not be ingested.";
  }

  function renderIngestCard(res, node) {
    const turn = el("div", "turn assistant");
    const bubble = el("div", "bubble");
    const dedup = res.deduplicated || res.status === "deduplicated";

    let head;
    if (dedup) {
      head = el("div", "ing-head", "🗂 Document already on file");
    } else if (res.status === "persisted") {
      head = el("div", "ing-head good", "✓ Document ingested");
    } else if (res.status === "needs_review") {
      head = el("div", "ing-head warn", "⚠ Scanned document — needs review");
    } else {
      head = el("div", "ing-head crit", "✕ Document could not be ingested");
    }
    bubble.appendChild(head);

    if (dedup) {
      bubble.appendChild(el("div", "dedup-box",
        "This document was already ingested for this patient — no new records were created."));
    } else if (res.status === "persisted") {
      bubble.appendChild(el("div", "ing-sub",
        res.fields_extracted + " of " + res.fields_total +
        " fields verified against the document text and recorded" +
        (res.document_id != null ? " · document #" + res.document_id : "") + "."));
    }

    const persisted = Array.isArray(res.persisted) ? res.persisted : [];
    if (persisted.length) {
      bubble.appendChild(el("div", "ing-sec", "Recorded facts — click a citation to see the source"));
      const cw = el("div", "cites");
      persisted.forEach(r => { const c = makeCite(r); if (c) cw.appendChild(c); });
      bubble.appendChild(cw);
    }

    const needsReview = Array.isArray(res.needs_review) ? res.needs_review : [];
    if (needsReview.length) {
      const nr = el("div", "nr-box");
      nr.appendChild(el("div", null,
        "This document has no machine-readable text layer, so " + needsReview.length +
        " field(s) could not be deterministically verified. They are flagged for human review — " +
        "nothing was recorded automatically."));
      nr.appendChild(el("div", "nr-fields",
        needsReview.map(f => cap(humanizeFieldId(f))).join(" · ")));
      bubble.appendChild(nr);
    }

    const gaps = Array.isArray(res.gaps) ? res.gaps : [];
    if (gaps.length) {
      bubble.appendChild(el("div", "ing-sec", "Gaps — stated, never inferred"));
      gaps.forEach(g => bubble.appendChild(el("div", "gap-line", gapToWords(g))));
    }

    if (res.notes) bubble.appendChild(el("div", "notes-line", res.notes));

    turn.appendChild(bubble);
    if (res.correlation_id) turn.appendChild(el("div", "meta", "ref " + res.correlation_id));
    if (node && node.parentNode) transcript.replaceChild(turn, node);
    else transcript.appendChild(turn);
    scrollTranscript();
  }

  async function doIngest() {
    if (!pendingFile || busy) return;
    const file = pendingFile, docType = pendingDocType;
    clearAttach();
    busy = true; setEnabled(false);
    starters.innerHTML = "";
    const label = docType === "intake_form" ? "Intake form"
      : docType === "medication_list" ? "Medication list" : "Lab report";
    renderUser("📎 " + label + ": " + file.name);
    // History (replayed to /chat) gets a filename-free line: uploaded file
    // names routinely contain patient names.
    history.push({ role: "user", text: "Uploaded a " + label.toLowerCase() + " document." });
    const node = makeLoading();
    try {
      const fd = new FormData();
      fd.append("file", file, file.name);
      fd.append("pid", String(currentPid));
      fd.append("doc_type", docType);
      const res = await fetch("/ingest", { method: "POST", headers: authHeaders(false), body: fd });
      if (!res.ok) {
        renderError(ingestHumanError(res.status), node);
      } else {
        const data = await res.json();
        renderIngestCard(data, node);
        history.push({ role: "assistant", text: summarizeIngest(data) });
      }
    } catch (e) {
      renderError("Could not reach the Co-Pilot service to upload the document. Check your connection and try again.", node);
    } finally {
      busy = false; setEnabled(true);
    }
  }

  // ================= OVERLAY (floating helper) =================
  const launcher = $("launcher"), launchBadge = $("launch-badge"), minBtn = $("min-btn");
  function setOverlayOpen(open) {
    document.body.classList.toggle("closed", !open);
    // Tell the parent iframe wrapper to grow/shrink. The parent's size lives
    // ONLY in that single postMessage, so a dropped/blocked message would leave
    // the iframe stuck (e.g. frozen at 76px after a minimize->reopen). Post once
    // now, then RE-ASSERT the same state on a short timeout so a missed message
    // self-heals without needing a page reload. The parent handler is idempotent,
    // so the retry is harmless when the first message already landed.
    function post() { try { parent.postMessage({ copilot: "state", open: open }, "*"); } catch (e) {} }
    post();
    setTimeout(post, 120);
  }
  function updateLaunchBadge(data) {
    if (!OVERLAY || !launchBadge) return;
    const flags = (data && data.constraint_flags) || [];
    const crit = flags.filter((f) => f.severity === "critical").length;
    const warn = flags.filter((f) => f.severity === "warning").length;
    launchBadge.classList.remove("show", "warn");
    if (crit) { launchBadge.textContent = String(crit); launchBadge.classList.add("show"); }
    else if (warn) { launchBadge.textContent = String(warn); launchBadge.classList.add("show", "warn"); }
  }
  if (OVERLAY) {
    document.body.classList.add("overlay", "closed");
    // Launcher always (re-)asserts open:true — never guard on "already open",
    // because the parent iframe may be out of sync (its size is the only source
    // of truth for open/closed on that side). An unconditional post guarantees
    // a click reopens the panel even if a prior state message was dropped.
    launcher.addEventListener("click", () => setOverlayOpen(true));
    minBtn.addEventListener("click", () => setOverlayOpen(false));
    // Post the initial (closed) state once so the parent wrapper and the panel
    // start in agreement instead of relying on the parent's default alone.
    setOverlayOpen(false);
  }

  // ================= INIT =================
  function showUnauthorized() {
    // No valid session token: the panel is inert until reopened from OpenEMR.
    setEnabled(false);
    if (dash) {
      dash.innerHTML = "";
      dash.appendChild(el("div", "inline-err",
        "Session not authorized — reopen from the OpenEMR chart."));
    }
  }
  // ?view=day opens straight to the schedule (the in-EMR "Co-Pilot" menu entry).
  const START_VIEW = new URLSearchParams(location.search).get("view");
  resolveToken().then((ok) => {
    if (!ok) { showUnauthorized(); return; }
    if (START_VIEW === "day") {
      selectTab("day");
    } else {
      loadSnapshot();
      if (!OVERLAY) input.focus();
    }
  });
})();
</script>
</body>
</html>
