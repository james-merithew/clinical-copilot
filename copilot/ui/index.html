<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Clinical Co-Pilot</title>
<style>
  :root {
    --canvas: #F6F9FB;
    --card: #FFFFFF;
    --card-2: #F1F6F9;
    --hair: #E6EDF1;
    --hair-strong: #D3DEE5;
    --text: #0B1524;
    --muted: #5C6B7A;
    --faint: #8A9AA6;

    --accent: #0FB5A6;
    --accent-hover: #0CA093;
    --accent-soft: rgba(15,181,166,.10);
    --accent-line: rgba(15,181,166,.28);
    --sky: #2E9BD6;

    --crit: #E5484D;   --crit-soft: #FDECEC; --crit-line: #F3C4C5; --crit-ink: #B4232A;
    --warn: #E8A317;   --warn-soft: #FCF3E1; --warn-line: #EFDBA8; --warn-ink: #9A6E08;
    --info: #2E9BD6;   --info-soft: #E9F3FB; --info-line: #C3E0F2; --info-ink: #1F6FA0;
    --good: #16A37B;   --good-soft: #E6F6EF; --good-line: #BFE6D4; --good-ink: #0E7C5D;

    --cite-bg: #EEF3F6; --cite-line: #E0E9EE; --cite-ink: #5C6B7A;
    --shadow: 0 1px 2px rgba(11,21,36,.05), 0 4px 14px rgba(11,21,36,.04);
    --shadow-lift: 0 2px 6px rgba(11,21,36,.08), 0 12px 30px rgba(11,21,36,.08);
    --radius: 14px;
    --radius-sm: 10px;
    --user-bubble: #0FB5A6;
    --user-ink: #FFFFFF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #0C1214;
      --card: #141D21;
      --card-2: #182329;
      --hair: #22303A;
      --hair-strong: #2E3F4A;
      --text: #E7EEF2;
      --muted: #8A9AA6;
      --faint: #6E7F8B;

      --accent: #17C4B4;
      --accent-hover: #2AD3C3;
      --accent-soft: rgba(23,196,180,.14);
      --accent-line: rgba(23,196,180,.34);
      --sky: #4FB0E4;

      --crit: #F0666B;   --crit-soft: rgba(229,72,77,.15); --crit-line: rgba(229,72,77,.38); --crit-ink: #F5A3A6;
      --warn: #EEB43F;   --warn-soft: rgba(232,163,23,.15); --warn-line: rgba(232,163,23,.36); --warn-ink: #F0CB78;
      --info: #4FB0E4;   --info-soft: rgba(46,155,214,.15); --info-line: rgba(46,155,214,.36); --info-ink: #9CD0EE;
      --good: #35BE95;   --good-soft: rgba(22,163,123,.15); --good-line: rgba(22,163,123,.36); --good-ink: #7BDCBB;

      --cite-bg: #1A252B; --cite-line: #29373F; --cite-ink: #93A4B0;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 6px 18px rgba(0,0,0,.28);
      --shadow-lift: 0 2px 8px rgba(0,0,0,.45), 0 16px 40px rgba(0,0,0,.4);
      --user-bubble: #0FB5A6;
      --user-ink: #04211E;
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow-x: hidden; }
  body {
    background: var(--canvas);
    color: var(--text);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    display: flex;
    justify-content: center;
  }
  ::selection { background: var(--accent-soft); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .app {
    display: flex; flex-direction: column;
    width: 100%; max-width: 860px;
    height: 100vh; height: 100dvh;
    margin: 0 auto;                          /* centered in any host width */
    background: var(--canvas);
    border-left: 1px solid var(--hair);
    border-right: 1px solid var(--hair);
    position: relative;
  }

  /* ---------- Overlay embed (floating helper inside the EMR chart) ---------- */
  body.overlay { background: transparent !important; }
  body.overlay .app {
    max-width: none; border: 1px solid var(--hair); border-radius: 18px;
    box-shadow: 0 18px 60px rgba(9, 30, 40, .30);
    overflow: hidden;
  }
  body.overlay.closed .app { display: none; }
  #launcher {
    /* Fixed size, bottom-right — NEVER `inset` (that scales the bubble to the
       whole iframe, so a large-in-closed-state frame renders a giant circle). */
    display: none; position: fixed; bottom: 8px; right: 8px;
    width: 60px; height: 60px;
    border: none; cursor: pointer; border-radius: 50%;
    background: linear-gradient(140deg, var(--accent), var(--sky));
    color: #fff; align-items: center; justify-content: center;
    box-shadow: 0 6px 22px rgba(15,181,166,.45);
    transition: transform .15s ease, box-shadow .15s ease;
  }
  #launcher:hover { transform: scale(1.06); box-shadow: 0 8px 26px rgba(15,181,166,.55); }
  #launcher svg { width: 26px; height: 26px; }
  body.overlay.closed #launcher { display: inline-flex; }
  #launch-badge {
    position: absolute; top: -2px; right: -2px; min-width: 20px; height: 20px;
    padding: 0 5px; border-radius: 999px; display: none;
    align-items: center; justify-content: center;
    font-size: 11.5px; font-weight: 800; color: #fff;
    background: var(--crit, #e5484d); border: 2px solid #fff;
  }
  #launch-badge.warn { background: var(--warn, #f5a524); }
  #launch-badge.show { display: inline-flex; }
  .minbtn {
    display: none; border: none; background: transparent; cursor: pointer;
    color: var(--muted); padding: 6px; border-radius: 8px; margin-left: 4px;
  }
  .minbtn:hover { background: var(--card-2); color: var(--text); }
  .minbtn svg { width: 17px; height: 17px; }
  body.overlay .minbtn { display: inline-flex; }
  /* The ops-dashboard link shows everywhere (standalone + overlay); only the
     minimize button is overlay-only. */
  #ops-link { display: inline-flex; align-items: center; }

  /* ---------- Top bar ---------- */
  .topbar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--hair);
    background: color-mix(in srgb, var(--card) 72%, transparent);
    backdrop-filter: saturate(1.4) blur(8px);
    position: sticky; top: 0; z-index: 30;
  }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .logo {
    width: 30px; height: 30px; flex: 0 0 auto; border-radius: 9px;
    background: linear-gradient(140deg, var(--accent), var(--sky));
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; box-shadow: 0 2px 8px rgba(15,181,166,.35);
  }
  .logo svg { width: 17px; height: 17px; }
  .brand .name { font-size: 15px; font-weight: 680; letter-spacing: -.01em; line-height: 1.1; }
  .brand .sub { font-size: 11px; color: var(--faint); font-weight: 500; letter-spacing: .01em; }

  .seg {
    margin-left: auto;
    display: inline-flex; padding: 3px; gap: 3px;
    background: var(--card-2); border: 1px solid var(--hair);
    border-radius: 999px;
  }
  .seg button {
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: -.005em;
    border: none; background: transparent; color: var(--muted);
    padding: 7px 15px; border-radius: 999px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
    transition: color .15s, background .15s, box-shadow .15s;
  }
  .seg button svg { width: 15px; height: 15px; }
  .seg button[aria-selected="true"] {
    background: var(--card); color: var(--text);
    box-shadow: var(--shadow);
  }
  @media (prefers-color-scheme: dark) {
    .seg button[aria-selected="true"] { background: #223038; }
  }

  /* ---------- Views ---------- */
  .view { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }

  /* ---------- Patient header ---------- */
  .patient-bar {
    flex: 0 0 auto;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px;
    border-bottom: 1px solid var(--hair);
    background: var(--card);
    z-index: 10;
  }
  .avatar {
    width: 42px; height: 42px; flex: 0 0 auto; border-radius: 12px;
    background: var(--accent-soft); color: var(--accent);
    display: inline-flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; letter-spacing: -.02em;
    border: 1px solid var(--accent-line);
  }
  .pt-id { min-width: 0; flex: 1 1 auto; }
  .pt-name {
    font-size: 20px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pt-meta { display: flex; align-items: center; gap: 8px; margin-top: 3px; flex-wrap: wrap; }
  .pt-meta .demo { font-size: 13px; color: var(--muted); font-weight: 500; }
  .pid-switch { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .pid-switch label { font-size: 12px; color: var(--faint); font-weight: 500; }
  .pid-switch input {
    width: 62px; padding: 7px 9px; border: 1px solid var(--hair-strong);
    border-radius: 9px; background: var(--card-2); color: var(--text);
    font: inherit; font-size: 13px; text-align: center; font-variant-numeric: tabular-nums;
  }
  .pid-switch input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

  /* ---------- Patient scroll region ---------- */
  .pt-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 16px 16px 8px; }

  /* ---------- Dashboard ---------- */
  .dashboard { display: flex; flex-direction: column; gap: 16px; }
  .dash-section { display: flex; flex-direction: column; gap: 9px; }
  .sec-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); margin: 2px 2px 1px; display: flex; align-items: center; gap: 8px;
  }
  .sec-label .n {
    color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums;
    background: var(--card-2); border: 1px solid var(--hair);
    min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; font-size: 11px;
  }

  /* allergy safety chips (atop the panel) */
  .alg-chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .alg-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 650; padding: 6px 11px; border-radius: 999px;
    background: var(--crit-soft); color: var(--crit-ink); border: 1px solid var(--crit-line);
  }
  .alg-chip .warn-ico { font-size: 12px; line-height: 1; }

  /* ---- Alerts & Notifications ---- */
  .alert-card {
    position: relative; overflow: hidden;
    background: var(--card); border: 1px solid var(--hair);
    border-radius: var(--radius-sm); box-shadow: var(--shadow);
    transition: box-shadow .18s, border-color .18s;
  }
  .alert-card:hover { box-shadow: var(--shadow-lift); }
  .alert-card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .alert-card.crit::before { background: var(--crit); }
  .alert-card.warn::before { background: var(--warn); }
  .alert-card.good::before { background: var(--good); }
  .alert-head {
    width: 100%; text-align: left; border: none; background: transparent; font: inherit; color: var(--text);
    display: flex; align-items: flex-start; gap: 10px; cursor: pointer; padding: 12px 13px 12px 17px;
  }
  .alert-card.calm .alert-head { cursor: default; }
  .alert-dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 auto; margin-top: 5px; }
  .alert-card.crit .alert-dot { background: var(--crit); box-shadow: 0 0 0 3px var(--crit-soft); }
  .alert-card.warn .alert-dot { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }
  .alert-card.good .alert-dot { background: var(--good); box-shadow: 0 0 0 3px var(--good-soft); }
  .alert-body { flex: 1 1 auto; min-width: 0; }
  .alert-titlerow { display: flex; align-items: baseline; gap: 10px; }
  .alert-title { font-size: 14.5px; font-weight: 700; letter-spacing: -.01em; color: var(--text); flex: 1 1 auto; min-width: 0; }
  .alert-card.calm .alert-title { color: var(--good-ink); font-weight: 650; }
  .alert-side { margin-left: auto; display: inline-flex; align-items: center; gap: 7px; flex: 0 0 auto; }
  .alert-sev { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; }
  .alert-card.crit .alert-sev { color: var(--crit-ink); }
  .alert-card.warn .alert-sev { color: var(--warn-ink); }
  .alert-chev { color: var(--faint); display: inline-flex; transition: transform .2s ease; }
  .alert-chev svg { width: 15px; height: 15px; display: block; }
  .alert-card.open .alert-chev { transform: rotate(90deg); }
  .alert-desc {
    font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .alert-card.open .alert-desc { white-space: normal; }
  .alert-cites { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
  .alert-card.open .alert-cites { grid-template-rows: 1fr; }
  .alert-cites > .inner { overflow: hidden; }
  .alert-cites .inner { padding: 0 13px 12px 17px; }

  /* ---- Metric cards (vitals + labs) ---- */
  .metric-lg-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 9px; }
  .metric-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 9px; }
  .metric-card {
    position: relative;
    background: var(--card); border: 1px solid var(--hair); border-radius: var(--radius-sm);
    box-shadow: var(--shadow); overflow: hidden; transition: box-shadow .18s, border-color .18s;
  }
  /* Status accent rail on the left edge — makes each tile read as a finished,
     at-a-glance clinical signal rather than a bare number in a box. */
  .metric-card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--good); border-top-left-radius: var(--radius-sm); border-bottom-left-radius: var(--radius-sm);
  }
  .metric-card.st-elevated::before, .metric-card.st-low::before { background: var(--warn); }
  .metric-card.st-high::before { background: var(--crit); }
  .metric-card:hover { box-shadow: var(--shadow-lift); border-color: var(--hair-strong); }
  .metric-head { width: 100%; text-align: left; border: none; background: transparent; font: inherit; color: var(--text); cursor: pointer; display: block; }
  .metric-card.lg .metric-head { padding: 13px 14px 13px 16px; }
  .metric-card.tile .metric-head { padding: 11px 12px 11px 14px; }
  .m-top, .t-top { display: flex; align-items: center; gap: 8px; }
  .m-label, .t-label {
    font-weight: 700; letter-spacing: .02em; text-transform: uppercase; color: var(--muted);
    flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .m-label { font-size: 12px; }
  .t-label { font-size: 11px; }
  .m-chev { color: var(--faint); display: inline-flex; transition: transform .2s ease; flex: 0 0 auto; }
  .m-chev svg { width: 15px; height: 15px; display: block; }
  .metric-card.open .m-chev { transform: rotate(90deg); }
  .m-valrow { display: flex; align-items: baseline; gap: 6px; margin-top: 9px; }
  .m-value { font-size: 30px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1; }
  .m-unit { font-size: 13px; font-weight: 600; color: var(--muted); }
  .m-sub { display: flex; align-items: baseline; gap: 8px; margin-top: 8px; }
  .m-statusword { font-size: 12.5px; font-weight: 700; }
  .m-latest { font-size: 11px; color: var(--faint); font-weight: 600; }
  .t-value { font-size: 22px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin-top: 7px; line-height: 1.05; }
  .t-value .t-unit { font-size: 12px; font-weight: 600; color: var(--muted); margin-left: 3px; }
  .t-status { font-size: 11.5px; font-weight: 700; margin-top: 4px; }
  .m-detail { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .2s ease; }
  .metric-card.open .m-detail { grid-template-rows: 1fr; }
  .m-detail > .inner { overflow: hidden; }
  .metric-card.lg .m-detail .inner { padding: 0 14px 13px 16px; }
  .metric-card.tile .m-detail .inner { padding: 0 12px 12px 14px; }
  .m-spark { margin: 4px 0 8px; }
  .m-cite { margin-top: 8px; }
  .spark { display: inline-block; line-height: 0; }
  .hist-row { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; padding: 3px 0; color: var(--muted); border-top: 1px solid var(--hair); }
  .hist-row:first-child { border-top: none; }
  .hist-row .hv { font-variant-numeric: tabular-nums; color: var(--text); font-weight: 600; }
  .hist-row .hv.ab { color: var(--crit); }

  /* T5: lab trend chart card (chat augmentation for the lab_trend chip) */
  .turn.assistant.trend-turn .bubble { width: 94%; }
  .trend-card .trend-title {
    font-size: 12px; font-weight: 700; letter-spacing: .02em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .trend-sec { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--hair); }
  .trend-sec:first-of-type { margin-top: 0; padding-top: 0; border-top: none; }
  .trend-name { font-size: 13.5px; font-weight: 700; margin-bottom: 5px; }
  .trend-chart svg { width: 100%; height: auto; display: block; }
  .trend-hist { margin-top: 6px; }
  .trend-hist summary {
    cursor: pointer; list-style: none; font-size: 11.5px; font-weight: 650; color: var(--muted);
  }
  .trend-hist summary::-webkit-details-marker { display: none; }
  .trend-hist summary .tw { display: inline-block; margin-right: 4px; transition: transform .15s ease; }
  .trend-hist[open] summary .tw { transform: rotate(90deg); }
  .trend-cite { margin-top: 6px; }

  /* footer prompt into chat */
  .ask-foot {
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 9px; padding: 11px 13px;
    background: var(--accent-soft); border: 1px solid var(--accent-line); border-radius: var(--radius-sm);
    color: var(--accent); font-size: 13.5px; font-weight: 650;
    transition: background .15s;
  }
  .ask-foot:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }
  .ask-foot .fi { display: inline-flex; flex: 0 0 auto; }
  .ask-foot .fi svg { width: 16px; height: 16px; }
  .ask-foot .arr { margin-left: auto; display: inline-flex; flex: 0 0 auto; }
  .ask-foot .arr svg { width: 15px; height: 15px; }

  /* citation chip */
  .cites { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .cite {
    display: inline-flex; align-items: center; gap: 5px; max-width: 100%;
    font-size: 10.5px; line-height: 1.3; padding: 2px 7px;
    background: var(--cite-bg); border: 1px solid var(--cite-line);
    border-radius: 999px; color: var(--cite-ink);
  }
  .cite code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 10px; color: var(--accent);
  }
  .cite .lbl { color: var(--cite-ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* flags inside can't-miss */
  .flagline { padding: 9px 11px; border-radius: var(--radius-sm); border: 1px solid; margin-top: 8px; }
  .flagline:first-child { margin-top: 0; }
  .flagline.critical { background: var(--crit-soft); border-color: var(--crit-line); }
  .flagline.warning { background: var(--warn-soft); border-color: var(--warn-line); }
  .flagline.info { background: var(--info-soft); border-color: var(--info-line); }
  .flagline .fmsg { font-size: 13.5px; font-weight: 550; line-height: 1.45; }
  .flagline.critical .fmsg { color: var(--crit-ink); }
  .flagline.warning .fmsg { color: var(--warn-ink); }
  .flagline.info .fmsg { color: var(--info-ink); }
  .flagline .fkind { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; opacity: .8; margin-bottom: 3px; }

  /* ---------- Conversation ---------- */
  .conv-label {
    font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em;
    color: var(--faint); margin: 20px 4px 10px; display: flex; align-items: center; gap: 8px;
  }
  .conv-label::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--hair); }
  .transcript { display: flex; flex-direction: column; gap: 14px; padding-bottom: 4px; }
  .turn { display: flex; flex-direction: column; max-width: 100%; }
  .turn.user { align-items: flex-end; }
  .turn.assistant { align-items: flex-start; }
  .bubble { max-width: 86%; padding: 11px 14px; border-radius: 16px; word-wrap: break-word; overflow-wrap: anywhere; }
  .turn.user .bubble { background: var(--user-bubble); color: var(--user-ink); border-bottom-right-radius: 5px; font-weight: 550; box-shadow: var(--shadow); }
  .turn.assistant .bubble { background: var(--card); border: 1px solid var(--hair); border-bottom-left-radius: 5px; max-width: 94%; box-shadow: var(--shadow); }
  .turn.error .bubble { background: var(--crit-soft); border: 1px solid var(--crit-line); color: var(--crit-ink); }
  .meta { font-size: 10.5px; color: var(--faint); margin: 4px 6px 0; font-variant-numeric: tabular-nums; }

  .claim { padding: 3px 0; }
  .claim + .claim { border-top: 1px dashed var(--hair); margin-top: 9px; padding-top: 10px; }
  .claim-text { margin: 0; line-height: 1.5; }

  .qbox { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--card-2); border: 1px dashed var(--hair-strong); }
  .qhead { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .qclaim { font-size: 13px; padding: 4px 0; color: var(--muted); }
  .qclaim + .qclaim { border-top: 1px dashed var(--hair); }

  .degraded { margin-bottom: 10px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); border: 1px solid var(--warn-line); color: var(--warn-ink); font-size: 13px; font-weight: 600; }
  .degraded .n { font-weight: 400; opacity: .92; font-size: 12.5px; margin-top: 2px; }
  .notes-line { margin-top: 8px; font-size: 12.5px; color: var(--muted); font-style: italic; }

  .achips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip {
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: -.005em;
    padding: 8px 14px; border-radius: 999px; cursor: pointer;
    background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--accent-line);
    transition: background .15s, transform .06s, box-shadow .15s;
  }
  .chip:hover { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  .chip:active { transform: translateY(1px); }
  .chip:disabled { opacity: .5; cursor: default; }

  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 3px 0; }
  .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%,80%,100% { opacity: .3; } 40% { opacity: 1; } }

  /* ---------- Week 2: citation union (patient_record / document / guideline) ---------- */
  .cite.click { cursor: pointer; transition: background .15s, border-color .15s; }
  .cite.click:hover { background: var(--accent-soft); border-color: var(--accent-line); }
  .cite-doc code { color: var(--sky); }
  .cite-gl { background: var(--info-soft); border-color: var(--info-line); }
  .cite-gl code { color: var(--info-ink); }
  .cite-gl.click:hover { background: color-mix(in srgb, var(--info) 18%, transparent); border-color: var(--info-line); }

  /* Guideline evidence — reference knowledge, VISUALLY separated from patient facts */
  .gl-section { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--info-soft); border: 1px solid var(--info-line); }
  .gl-head { font-size: 11.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--info-ink); display: flex; gap: 6px; align-items: center; }
  .gl-sub { font-size: 11px; color: var(--muted); margin: 2px 0 8px; }
  .gl-claim { font-size: 13.5px; padding: 5px 0; line-height: 1.5; }
  .gl-claim + .gl-claim { border-top: 1px dashed var(--info-line); }

  /* guideline evidence popover */
  .gl-pop {
    position: fixed; z-index: 95; max-width: 340px; min-width: 240px;
    background: var(--card); border: 1px solid var(--hair-strong);
    border-radius: var(--radius-sm); box-shadow: var(--shadow-lift); padding: 12px 14px;
  }
  .gl-pop .gp-title { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
  .gl-pop .gp-sec { font-size: 11px; color: var(--faint); margin-bottom: 8px; }
  .gl-pop .gp-quote { font-size: 12.5px; color: var(--muted); line-height: 1.5; border-left: 3px solid var(--info-line); padding-left: 9px; margin: 0 0 8px; font-style: italic; }
  .gl-pop .gp-src { font-size: 11.5px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
  .gl-pop .gp-src a { color: var(--sky); font-weight: 600; text-decoration: none; word-break: break-all; }
  .gl-pop .gp-src a:hover { text-decoration: underline; }
  .gl-pop .gp-note { font-size: 10.5px; color: var(--faint); margin-top: 8px; border-top: 1px solid var(--hair); padding-top: 6px; }

  /* handoff trail — "how this answer was assembled" (collapsed by default) */
  .handoffs { margin: 6px 6px 0; font-size: 12px; color: var(--muted); max-width: 94%; }
  .handoffs summary {
    cursor: pointer; font-size: 11px; font-weight: 700; color: var(--faint);
    text-transform: uppercase; letter-spacing: .05em; list-style: none; display: inline-flex; align-items: center; gap: 5px;
  }
  .handoffs summary::-webkit-details-marker { display: none; }
  .handoffs summary .tw { display: inline-block; transition: transform .15s; }
  .handoffs[open] summary .tw { transform: rotate(90deg); }
  .handoffs .hops { margin-top: 6px; border: 1px solid var(--hair); border-radius: var(--radius-sm); background: var(--card); padding: 4px 10px; }
  .hop { display: flex; gap: 8px; padding: 5px 0; border-top: 1px dashed var(--hair); align-items: baseline; flex-wrap: wrap; }
  .hop:first-child { border-top: none; }
  .hop .seq { font-variant-numeric: tabular-nums; color: var(--faint); flex: 0 0 auto; }
  .hop .path { font-weight: 650; color: var(--text); flex: 0 0 auto; }
  .hop .route { font-size: 10.5px; font-weight: 700; color: var(--info-ink); background: var(--info-soft); border: 1px solid var(--info-line); border-radius: 999px; padding: 1px 7px; }
  .hop .ms { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--faint); }
  .hop .why { flex-basis: 100%; font-size: 11.5px; color: var(--muted); }

  /* ---------- Week 2: document viewer with bbox overlay (D7 / §5.3) ---------- */
  .dv-backdrop {
    position: fixed; inset: 0; z-index: 90; background: rgba(7, 15, 20, .55);
    display: none; align-items: center; justify-content: center; padding: 16px;
  }
  .dv-backdrop.open { display: flex; }
  .dv-panel {
    width: min(760px, 96vw); max-height: 94vh; display: flex; flex-direction: column;
    background: var(--card); border: 1px solid var(--hair-strong);
    border-radius: var(--radius); box-shadow: var(--shadow-lift); overflow: hidden;
  }
  .dv-top { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--hair); }
  .dv-title { font-weight: 700; font-size: 14px; flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv-close { border: none; background: transparent; cursor: pointer; color: var(--muted); padding: 6px; border-radius: 8px; flex: 0 0 auto; }
  .dv-close:hover { background: var(--card-2); color: var(--text); }
  .dv-close svg { width: 16px; height: 16px; display: block; }
  .dv-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11px; color: var(--faint); padding: 8px 14px 0; }
  .dv-legend .k { display: inline-flex; align-items: center; gap: 5px; }
  .dv-legend .sw { width: 14px; height: 10px; border: 2px solid var(--accent); border-radius: 2px; display: inline-block; }
  .dv-legend .sw.approx { border-style: dashed; border-color: var(--warn); }
  .dv-body { overflow: auto; padding: 12px 14px 14px; background: var(--card-2); flex: 1 1 auto; min-height: 120px; }
  .dv-banner { margin-bottom: 10px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--warn-soft); border: 1px solid var(--warn-line); color: var(--warn-ink); font-size: 12.5px; font-weight: 600; }
  .dv-stage { position: relative; margin: 0 auto; line-height: 0; box-shadow: var(--shadow); }
  .dv-stage img { width: 100%; display: block; border-radius: 4px; background: #fff; }
  .dv-box { position: absolute; border: 2px solid var(--accent); border-radius: 3px; background: rgba(15,181,166,.08); }
  .dv-box.approx { border-style: dashed; border-color: var(--warn); background: rgba(232,163,23,.10); }
  .dv-box .tag {
    position: absolute; top: -17px; left: -2px; font-size: 9px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .04em; line-height: 1.5;
    background: var(--warn); color: #fff; padding: 0 5px; border-radius: 4px; white-space: nowrap;
  }
  .dv-box.hl { border-color: var(--sky); background: rgba(46,155,214,.16); box-shadow: 0 0 0 3px rgba(46,155,214,.30); }
  .dv-box.hl.approx { border-color: var(--warn); box-shadow: 0 0 0 3px rgba(232,163,23,.30); }
  .dv-nav { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--hair); }
  .dv-nav button {
    font: inherit; font-size: 12.5px; font-weight: 650; padding: 6px 12px; border-radius: 9px;
    border: 1px solid var(--hair-strong); background: var(--card-2); color: var(--text); cursor: pointer;
  }
  .dv-nav button:disabled { opacity: .4; cursor: default; }
  .dv-page-ind { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }
  .dv-msg { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13px; }

  /* ---------- Week 2: upload + ingest result card ---------- */
  .clip {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px;
    border: 1px solid var(--hair-strong); background: var(--card-2); color: var(--muted);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: color .15s, border-color .15s;
  }
  .clip:hover { color: var(--accent); border-color: var(--accent-line); }
  .clip:disabled { opacity: .45; cursor: default; }
  .clip svg { width: 19px; height: 19px; }
  .attach-bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
    padding: 9px 12px; border: 1px solid var(--accent-line); background: var(--accent-soft);
    border-radius: var(--radius-sm); font-size: 13px;
  }
  .attach-name { font-weight: 650; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attach-size { color: var(--muted); font-size: 12px; }
  .doct-seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--card); border: 1px solid var(--hair); border-radius: 999px; }
  .doct-seg button { font: inherit; font-size: 12px; font-weight: 650; border: none; background: transparent; color: var(--muted); padding: 5px 11px; border-radius: 999px; cursor: pointer; }
  .doct-seg button.on { background: var(--accent); color: #fff; }
  .attach-actions { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .attach-go { font: inherit; font-size: 12.5px; font-weight: 700; border: none; border-radius: 9px; padding: 7px 14px; background: var(--accent); color: #fff; cursor: pointer; }
  .attach-go:hover { background: var(--accent-hover); }
  .attach-x { border: none; background: transparent; color: var(--muted); cursor: pointer; padding: 6px; border-radius: 8px; }
  .attach-x:hover { background: var(--card-2); color: var(--text); }
  .attach-x svg { width: 15px; height: 15px; display: block; }

  .ing-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .ing-head.good { color: var(--good-ink); }
  .ing-head.warn { color: var(--warn-ink); }
  .ing-head.crit { color: var(--crit-ink); }
  .ing-sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .ing-sec { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); margin: 10px 0 4px; }
  .gap-line { font-size: 12.5px; color: var(--warn-ink); background: var(--warn-soft); border: 1px solid var(--warn-line); border-radius: 8px; padding: 6px 10px; margin-top: 5px; line-height: 1.45; }
  .nr-box { margin-top: 8px; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--info-soft); border: 1px solid var(--info-line); color: var(--info-ink); font-size: 12.5px; line-height: 1.5; }
  .nr-box .nr-fields { margin-top: 5px; color: var(--muted); font-size: 12px; }
  .dedup-box { margin-top: 6px; padding: 9px 11px; border-radius: var(--radius-sm); background: var(--card-2); border: 1px dashed var(--hair-strong); color: var(--muted); font-size: 13px; font-weight: 600; }

  /* ---------- Composer ---------- */
  .composer-wrap { flex: 0 0 auto; border-top: 1px solid var(--hair); background: var(--card); padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); }
  .starters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .composer { display: flex; gap: 9px; align-items: flex-end; }
  .composer textarea {
    flex: 1 1 auto; resize: none; font: inherit; font-size: 14.5px;
    padding: 11px 14px; border: 1px solid var(--hair-strong);
    border-radius: 13px; background: var(--card-2); color: var(--text);
    max-height: 140px; line-height: 1.45;
  }
  .composer textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .send {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 13px; border: none;
    background: var(--accent); color: #fff; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, transform .06s;
  }
  .send:hover { background: var(--accent-hover); }
  .send:active { transform: translateY(1px); }
  .send:disabled { opacity: .45; cursor: default; }
  .send svg { width: 19px; height: 19px; }
  .hint { font-size: 11px; color: var(--faint); margin-top: 7px; text-align: center; }

  /* ---------- My Day ---------- */
  .day-bar { flex: 0 0 auto; padding: 16px 18px; border-bottom: 1px solid var(--hair); background: var(--card); }
  .day-date { font-size: 19px; font-weight: 700; letter-spacing: -.02em; }
  .day-sub { display: flex; align-items: center; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
  .day-sub .count { font-size: 13px; color: var(--muted); font-weight: 550; }
  .day-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 12px 14px 16px; }
  .appt {
    width: 100%; text-align: left; border: 1px solid var(--hair); background: var(--card);
    border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 10px; cursor: pointer;
    display: flex; align-items: center; gap: 14px; padding: 13px 14px;
    transition: box-shadow .16s, transform .06s, border-color .16s; font: inherit; color: var(--text);
  }
  .appt:hover { box-shadow: var(--shadow-lift); }
  .appt:active { transform: translateY(1px); }
  .appt.flagged { border-color: var(--crit-line); }
  .appt.flagged.warn-only { border-color: var(--warn-line); }
  .appt .time { flex: 0 0 auto; width: 62px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .appt .who { flex: 1 1 auto; min-width: 0; }
  .appt .who .nm { font-size: 15px; font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt .who .rs { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .appt .right { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
  .flagdot { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .flagdot.crit { background: var(--crit-soft); color: var(--crit-ink); }
  .flagdot.warn { background: var(--warn-soft); color: var(--warn-ink); }
  .flagdot .d { width: 7px; height: 7px; border-radius: 50%; }
  .flagdot.crit .d { background: var(--crit); }
  .flagdot.warn .d { background: var(--warn); }
  .changed { font-size: 10.5px; font-weight: 700; color: var(--sky); background: var(--info-soft); border: 1px solid var(--info-line); padding: 3px 8px; border-radius: 999px; }

  /* ---------- states ---------- */
  .state { text-align: center; color: var(--muted); padding: 48px 24px; }
  .state .big { color: var(--faint); margin-bottom: 12px; }
  .state .big svg { width: 40px; height: 40px; }
  .state h3 { font-size: 16px; color: var(--text); margin: 0 0 6px; font-weight: 650; }
  .state p { margin: 0; font-size: 13.5px; }
  .inline-err { margin: 10px 0; padding: 11px 13px; border-radius: var(--radius-sm); background: var(--crit-soft); border: 1px solid var(--crit-line); color: var(--crit-ink); font-size: 13.5px; font-weight: 550; }

  /* skeleton */
  .sk { position: relative; overflow: hidden; background: var(--card-2); border-radius: 6px; }
  .sk::after { content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--card) 60%, transparent), transparent);
    animation: shimmer 1.3s infinite; }
  @keyframes shimmer { 100% { transform: translateX(100%); } }
  .sk-line { height: 11px; margin: 8px 0; }

  @media (max-width: 560px) {
    .topbar { flex-wrap: wrap; }
    .seg { margin-left: 0; width: 100%; justify-content: center; }
    .brand { order: 0; }
    .patient-bar { flex-wrap: wrap; }
    .pid-switch { margin-left: 0; }
    .bubble { max-width: 92%; }
    .turn.assistant .bubble { max-width: 100%; }
    .metric-lg-grid { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>
        </span>
        <div>
          <div class="name">Clinical Co-Pilot</div>
          <div class="sub">read-only · source-attributed</div>
        </div>
      </div>
      <div class="seg" role="tablist" aria-label="View">
        <button id="tab-patient" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21a8 8 0 1 0-16 0"/><circle cx="12" cy="7" r="4"/></svg>
          This Patient
        </button>
        <button id="tab-day" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          My Day
        </button>
      </div>
      <a id="ops-link" class="minbtn" href="/dashboard" target="_blank" rel="noopener" title="System dashboard (PHI-free ops metrics)" aria-label="Open the system dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 14l4-4 3 3 5-6"/></svg>
      </a>
      <button id="min-btn" class="minbtn" type="button" title="Minimize" aria-label="Minimize Co-Pilot">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
    </div>

    <!-- THIS PATIENT -->
    <section class="view active" id="view-patient" role="tabpanel" aria-labelledby="tab-patient">
      <div class="patient-bar" id="patient-bar"></div>
      <div class="pt-scroll">
        <div class="dashboard" id="dashboard"></div>
        <div class="conv-label">Conversation</div>
        <div class="transcript" id="transcript" aria-live="polite"></div>
      </div>
      <div class="composer-wrap">
        <div class="attach-bar" id="attach-bar" style="display:none"></div>
        <div class="starters" id="starters"></div>
        <form class="composer" id="composer">
          <button type="button" class="clip" id="clip" title="Attach a document (PDF, PNG or JPG)" aria-label="Attach a document">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <input type="file" id="file-input" accept="application/pdf,image/png,image/jpeg" style="display:none" aria-hidden="true" tabindex="-1" />
          <textarea id="input" rows="1" placeholder="Ask about this patient…" autocomplete="off" aria-label="Message"></textarea>
          <button type="submit" class="send" id="send" title="Send" aria-label="Send">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z" fill="currentColor" stroke="none"/></svg>
          </button>
        </form>
        <div class="hint">Enter to send · Shift+Enter for newline · Co-Pilot surfaces context only; OpenEMR remains the system of record.</div>
      </div>
    </section>

    <!-- MY DAY -->
    <section class="view" id="view-day" role="tabpanel" aria-labelledby="tab-day">
      <div class="day-bar" id="day-bar"></div>
      <div class="day-scroll" id="day-scroll"></div>
    </section>
  </div>

  <!-- Week 2: document viewer (bbox overlay, D7) -->
  <div class="dv-backdrop" id="dv-backdrop" role="dialog" aria-modal="true" aria-label="Document viewer">
    <div class="dv-panel">
      <div class="dv-top">
        <div class="dv-title" id="dv-title">Document</div>
        <button class="dv-close" id="dv-close" type="button" title="Close" aria-label="Close document viewer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="dv-legend">
        <span class="k"><span class="sw"></span> verified against document text</span>
        <span class="k"><span class="sw approx"></span> approximate (model-estimated)</span>
      </div>
      <div class="dv-body" id="dv-body"></div>
      <div class="dv-nav">
        <button id="dv-prev" type="button">‹ Prev</button>
        <button id="dv-next" type="button">Next ›</button>
        <span class="dv-page-ind" id="dv-ind"></span>
      </div>
    </div>
  </div>

  <!-- Week 2: guideline evidence popover -->
  <div class="gl-pop" id="gl-pop" style="display:none" role="tooltip"></div>

  <!-- Floating launcher (overlay embed mode only) -->
  <button id="launcher" type="button" title="Open Clinical Co-Pilot" aria-label="Open Clinical Co-Pilot">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/></svg>
    <span id="launch-badge" aria-hidden="true"></span>
  </button>

<script>
(function () {
  "use strict";

  // Session token (AUTH_TOKEN_SPEC.md): OpenEMR appends it to the iframe URL
  // fragment (#t=<token>); the fragment never reaches the server, so the token
  // stays out of access logs. No token is baked into this page anymore.
  let TOKEN = "";
  let DAY_TOKEN = "";   // scope="day" token for /day (the schedule spans patients)
  function readHashParam(name) {
    const h = (location.hash || "").replace(/^#/, "");
    const fromHash = new URLSearchParams(h).get(name);
    if (fromHash) return fromHash;
    return new URLSearchParams(location.search).get(name) || "";
  }
  function wireOpsLink() {
    // The ops dashboard reads its token from the URL fragment (#t=...), same
    // discipline as this panel: the fragment never reaches server logs. Any
    // valid session token works — /metrics/summary is PHI-free counters only.
    const a = document.getElementById("ops-link");
    if (a && TOKEN) a.href = "/dashboard#t=" + encodeURIComponent(TOKEN);
  }
  async function resolveToken() {
    TOKEN = readHashParam("t");
    DAY_TOKEN = readHashParam("d");   // OpenEMR overlay mints both (#t=..&d=..)
    if (TOKEN) { wireOpsLink(); return true; }
    // Local dev convenience: the sidecar mints a token only when
    // COPILOT_AUTH_DEV_MODE=true (404 otherwise). Never available in prod.
    const view = new URLSearchParams(location.search).get("view");
    const scope = view === "day" ? "day" : "patient";
    try {
      const r = await fetch("/dev/token?scope=" + scope);
      if (r.ok) { TOKEN = (await r.json()).token || ""; }
      // A patient overlay also needs a day token for the My Day tab.
      if (TOKEN && scope === "patient") {
        const rd = await fetch("/dev/token?scope=day");
        if (rd.ok) { DAY_TOKEN = (await rd.json()).token || ""; }
      }
      wireOpsLink();
      return !!TOKEN;
    } catch (e) { /* fall through to unauthorized */ }
    return false;
  }
  const EMBED_PID_RAW = "__COPILOT_PID__";
  const DEFAULT_PID_RAW = "__COPILOT_DEFAULT_PID__";
  const MAX_HISTORY = 12;

  // ---- embed mode ----
  // "overlay" = floating helper inside the chart (bubble -> panel).
  // "emr"     = the in-EMR My Day page; patient clicks hand off to the chart.
  const EMBED_MODE = new URLSearchParams(location.search).get("embed") || "";
  const OVERLAY = EMBED_MODE === "overlay";
  const EMR_HANDOFF = EMBED_MODE === "emr";

  // ---- pid + embed resolution ----
  function toPosInt(v) { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : null; }
  const embedPid = toPosInt(EMBED_PID_RAW);
  const urlPid = toPosInt(new URLSearchParams(location.search).get("pid"));
  const LOCKED = !!(embedPid || urlPid);           // embed mode => hide manual input
  // Server-injected default (a seeded showcase patient) — never a bare "1",
  // which may not exist and made the standalone panel look broken.
  let currentPid = embedPid || urlPid || toPosInt(DEFAULT_PID_RAW) || 101;

  // Client-local calendar date (the physician's day, not the server's UTC day).
  function localISODate() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  // ---- DOM ----
  const $ = (id) => document.getElementById(id);
  const dash = $("dashboard");
  const ptBar = $("patient-bar");
  const transcript = $("transcript");
  const starters = $("starters");
  const composer = $("composer");
  const input = $("input");
  const send = $("send");
  const dayBar = $("day-bar");
  const dayScroll = $("day-scroll");

  let history = [];      // [{role,text}]
  let busy = false;
  let snapshot = null;   // last SnapshotResponse
  let dayLoaded = false;

  // ---- element helper ----
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function frag() { return document.createDocumentFragment(); }
  function svgIcon(path, sw) {
    const s = 'stroke-width="' + (sw || 2) + '"';
    const span = document.createElement("span");
    span.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' + s + ' stroke-linecap="round" stroke-linejoin="round">' + path + '</svg>';
    return span.firstChild;
  }
  const ICONS = {
    alert: '<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>',
    problem: '<path d="M8 2v4M16 2v4M3 10h18"/><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M9 14l2 2 4-4"/>',
    med: '<path d="m10.5 20.5-7-7a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7z"/><path d="m8.5 8.5 7 7"/>',
    allergy: '<path d="M12 2a10 10 0 1 0 10 10"/><path d="M12 8v4M12 16h.01"/>',
    lab: '<path d="M9 3h6M10 3v6l-4.5 8A2 2 0 0 0 7.3 20h9.4a2 2 0 0 0 1.8-3L14 9V3"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    chevron: '<path d="m9 18 6-6-6-6"/>',
    chat: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>'
  };

  function scrollTranscript() {
    const c = document.querySelector(".pt-scroll");
    requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; });
  }

  // ---- citations (Week 2: AnySourceRef union — switch on source_type) ----
  // patient_record -> table#pk pill (Week 1 unchanged)
  // document       -> doc + page pill; click opens the bbox overlay viewer
  // guideline      -> guideline pill; click opens the evidence popover
  function makeCite(ref) {
    if (!ref) return null;
    const st = ref.source_type ||
      (ref.table ? "patient_record" : (ref.document_id != null ? "document" : (ref.chunk_id ? "guideline" : null)));
    if (st === "document") return makeDocCite(ref);
    if (st === "guideline") return makeGlCite(ref);
    const c = el("span", "cite");
    const code = el("code");
    const pk = (ref.primary_key !== undefined && ref.primary_key !== null) ? ("#" + ref.primary_key) : "";
    code.textContent = (ref.table || "?") + pk;
    c.appendChild(code);
    if (ref.label) { const l = el("span", "lbl"); l.textContent = ref.label; c.appendChild(l); }
    return c;
  }
  function makeDocCite(ref) {
    const c = el("span", "cite cite-doc click");
    c.setAttribute("role", "button");
    c.tabIndex = 0;
    const code = el("code");
    code.textContent = "doc#" + ref.document_id + (ref.page ? " p." + ref.page : "");
    c.appendChild(code);
    if (ref.label) { const l = el("span", "lbl"); l.textContent = ref.label; c.appendChild(l); }
    c.title = (ref.quote ? "“" + ref.quote + "” — " : "") + "click to view on the document";
    const open = () => openDocViewer(ref);
    c.addEventListener("click", open);
    c.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    return c;
  }
  function makeGlCite(ref) {
    const c = el("span", "cite cite-gl click");
    c.setAttribute("role", "button");
    c.tabIndex = 0;
    const code = el("code");
    code.textContent = "guideline";
    c.appendChild(code);
    const l = el("span", "lbl");
    l.textContent = ref.label || ref.section || ref.doc_id || ref.chunk_id;
    c.appendChild(l);
    c.title = "Reference knowledge — click for the evidence";
    const open = (e) => { e.stopPropagation(); openGlPopover(ref, c); };
    c.addEventListener("click", open);
    c.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openGlPopover(ref, c); } });
    return c;
  }

  // Guideline metadata registry: filled from the chat response's
  // guideline_evidence / briefing claims (no extra endpoint). chunk_id -> meta.
  const GL_META = {};
  function registerGlMeta(claims) {
    (claims || []).forEach(cl => {
      (cl.source_refs || []).forEach(r => {
        const st = r.source_type || (r.chunk_id && !r.table ? "guideline" : null);
        if (st !== "guideline" || !r.chunk_id) return;
        const prev = GL_META[r.chunk_id] || {};
        GL_META[r.chunk_id] = {
          label: r.label || prev.label,
          section: r.section || prev.section,
          doc_id: r.doc_id || prev.doc_id,
          claim_text: cl.text || prev.claim_text,
          // Present when the server ships them on the ref/claim; render if so.
          quote: r.quote || prev.quote,
          source_org: r.source_org || prev.source_org,
          source_url: r.source_url || prev.source_url
        };
      });
    });
  }

  // ---- guideline evidence popover ----
  const glPop = $("gl-pop");
  function closeGlPopover() { glPop.style.display = "none"; }
  function openGlPopover(ref, anchor) {
    const meta = (ref.chunk_id && GL_META[ref.chunk_id]) || {};
    glPop.innerHTML = "";
    glPop.appendChild(el("div", "gp-title", ref.label || meta.label || "Guideline"));
    const secBits = [];
    if (ref.section || meta.section) secBits.push(ref.section || meta.section);
    if (ref.chunk_id) secBits.push(ref.chunk_id);
    if (secBits.length) glPop.appendChild(el("div", "gp-sec", secBits.join(" · ")));
    const quote = meta.quote || ref.quote || meta.claim_text;
    if (quote) glPop.appendChild(el("blockquote", "gp-quote", "“" + quote + "”"));
    const org = meta.source_org || ref.source_org;
    const url = meta.source_url || ref.source_url;
    if (org || url) {
      const src = el("div", "gp-src");
      if (org) src.appendChild(el("span", null, org));
      if (url) {
        const a = el("a", null, url.replace(/^https?:\/\//, ""));
        a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
        src.appendChild(a);
      }
      glPop.appendChild(src);
    }
    glPop.appendChild(el("div", "gp-note",
      "Reference knowledge from the office protocol corpus — not this patient's chart."));
    // position near the anchor, clamped to the viewport
    glPop.style.display = "block";
    const r = anchor.getBoundingClientRect();
    const pw = glPop.offsetWidth, ph = glPop.offsetHeight;
    let left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
    let top = r.bottom + 6;
    if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
    glPop.style.left = left + "px";
    glPop.style.top = top + "px";
  }
  document.addEventListener("click", (e) => {
    if (glPop.style.display !== "none" && !glPop.contains(e.target)) closeGlPopover();
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeGlPopover(); closeDocViewer(); } });

  // ---- document viewer (bbox overlay; server-rendered pages, §5.3) ----
  const dvBackdrop = $("dv-backdrop"), dvBody = $("dv-body"), dvTitle = $("dv-title"),
        dvInd = $("dv-ind"), dvPrev = $("dv-prev"), dvNext = $("dv-next"), dvClose = $("dv-close");
  const dv = { docId: null, pid: null, page: 1, pageCount: 1, refs: [], focus: null, blobs: {}, token: 0 };

  function closeDocViewer() {
    if (!dvBackdrop.classList.contains("open")) return;
    dvBackdrop.classList.remove("open");
    Object.keys(dv.blobs).forEach(k => { try { URL.revokeObjectURL(dv.blobs[k]); } catch (e) {} });
    dv.blobs = {};
    dv.token++; // invalidate in-flight loads
  }
  dvClose.addEventListener("click", closeDocViewer);
  dvBackdrop.addEventListener("click", (e) => { if (e.target === dvBackdrop) closeDocViewer(); });
  dvPrev.addEventListener("click", () => { if (dv.page > 1) { dv.page--; renderDvPage(); } });
  dvNext.addEventListener("click", () => { if (dv.page < dv.pageCount) { dv.page++; renderDvPage(); } });

  function refBoxPage(r) { return (r && r.bbox && r.bbox.page) || (r && r.page) || null; }
  function sameRef(a, b) {
    return !!(a && b && a.document_id === b.document_id &&
      (a.field_id || "") === (b.field_id || "") && (a.page || null) === (b.page || null));
  }

  async function openDocViewer(ref) {
    dv.docId = ref.document_id;
    dv.pid = currentPid;
    dv.focus = ref;
    dv.page = refBoxPage(ref) || 1;
    dv.pageCount = 1;
    dv.refs = [ref];
    dvTitle.textContent = ref.label || ("Document #" + ref.document_id);
    dvBody.innerHTML = "";
    dvBody.appendChild(el("div", "dv-msg", "Loading document…"));
    dvInd.textContent = "";
    dvPrev.disabled = dvNext.disabled = true;
    dvBackdrop.classList.add("open");

    const token = ++dv.token;
    const q = "?pid=" + encodeURIComponent(dv.pid);
    try {
      const [metaRes, citRes] = await Promise.all([
        fetch("/documents/" + dv.docId + "/meta" + q, { headers: authHeaders(false) }),
        fetch("/documents/" + dv.docId + "/citations" + q, { headers: authHeaders(false) })
      ]);
      if (token !== dv.token) return; // viewer closed/reopened meanwhile
      if (!metaRes.ok) {
        dvBody.innerHTML = "";
        dvBody.appendChild(el("div", "dv-msg",
          metaRes.status === 404 ? "This document is not available (not found for this patient, or ingestion is disabled)."
          : metaRes.status === 403 ? "Not authorized to view this document (403)."
          : humanError(metaRes.status)));
        return;
      }
      const meta = await metaRes.json();
      dv.pageCount = meta.page_count || 0;
      if (citRes.ok) {
        try {
          const cits = await citRes.json();
          if (Array.isArray(cits) && cits.length) {
            dv.refs = cits.slice();
            if (!dv.refs.some(r => sameRef(r, ref))) dv.refs.push(ref);
          }
        } catch (e) { /* citations are an enhancement, never fatal */ }
      }
      if (!dv.pageCount) {
        dvBody.innerHTML = "";
        dvBody.appendChild(el("div", "dv-msg",
          "No page preview is available for this file type. The citation still binds to document #" + dv.docId + "."));
        return;
      }
      dv.page = Math.min(Math.max(1, dv.page), dv.pageCount);
      renderDvPage();
    } catch (e) {
      if (token !== dv.token) return;
      dvBody.innerHTML = "";
      dvBody.appendChild(el("div", "dv-msg", "Could not load the document. Check your connection and try again."));
    }
  }

  async function renderDvPage() {
    const token = ++dv.token;
    dvInd.textContent = "page " + dv.page + " / " + dv.pageCount;
    dvPrev.disabled = dv.page <= 1;
    dvNext.disabled = dv.page >= dv.pageCount;
    dvBody.innerHTML = "";

    // page-level banner when the focused citation has no exact region
    const focusOnThisDoc = dv.focus && dv.focus.document_id === dv.docId;
    if (focusOnThisDoc && !dv.focus.bbox) {
      dvBody.appendChild(el("div", "dv-banner",
        dv.focus.page
          ? "No exact region is recorded for this citation — showing page " + (refBoxPage(dv.focus) || dv.page) + "."
          : "This citation has no recorded location on the document."));
    }
    dvBody.appendChild(el("div", "dv-msg", "Rendering page…"));

    const key = dv.docId + ":" + dv.page;
    let url = dv.blobs[key];
    if (!url) {
      try {
        const res = await fetch(
          "/documents/" + dv.docId + "/page/" + dv.page + ".png?pid=" + encodeURIComponent(dv.pid),
          { headers: authHeaders(false) });
        if (token !== dv.token) return;
        if (!res.ok) {
          dvBody.querySelector(".dv-msg").textContent =
            res.status === 415 ? "No page preview is available for this file type."
            : "Could not render this page (" + res.status + ").";
          return;
        }
        url = URL.createObjectURL(await res.blob());
        dv.blobs[key] = url;
      } catch (e) {
        if (token !== dv.token) return;
        dvBody.querySelector(".dv-msg").textContent = "Could not render this page. Check your connection.";
        return;
      }
    }
    if (token !== dv.token) return;

    const msg = dvBody.querySelector(".dv-msg");
    if (msg) msg.remove();
    const stage = el("div", "dv-stage");
    const img = el("img");
    img.alt = "Document #" + dv.docId + " page " + dv.page;
    img.src = url;
    stage.appendChild(img);

    // percentage-positioned bbox overlays: solid = text_layer, dashed = vlm
    dv.refs.forEach(r => {
      if (!r || !r.bbox || refBoxPage(r) !== dv.page) return;
      const b = r.bbox;
      const box = el("div", "dv-box" + (b.origin === "vlm" ? " approx" : "") +
        (focusOnThisDoc && sameRef(r, dv.focus) ? " hl" : ""));
      box.style.left = (b.x0 * 100) + "%";
      box.style.top = (b.y0 * 100) + "%";
      box.style.width = (Math.max(0, b.x1 - b.x0) * 100) + "%";
      box.style.height = (Math.max(0, b.y1 - b.y0) * 100) + "%";
      box.title = (r.label || r.field_id || "") + (r.quote ? " — “" + r.quote + "”" : "");
      if (b.origin === "vlm") box.appendChild(el("span", "tag", "approximate"));
      stage.appendChild(box);
    });
    dvBody.appendChild(stage);
  }
  function makeCites(refs, parentTitle) {
    if (!refs || !refs.length) return null;
    const w = el("div", "cites");
    refs.forEach(r => { const c = makeCite(r); if (c) w.appendChild(c); });
    return w;
  }
  // one small chip for a single .source
  function sourceChip(source) {
    const c = makeCite(source);
    if (c && source && source.label) {
      c.title = (source.table || "") + "#" + source.primary_key + " · " + source.label;
    }
    return c;
  }

  // ================= SPARKLINE =================
  function numify(v) {
    if (v == null) return NaN;
    const m = String(v).match(/-?\d+(\.\d+)?/);
    return m ? parseFloat(m[0]) : NaN;
  }
  function sparkline(series) {
    const pts = series.map(p => ({ v: numify(p.value), ab: !!p.abnormal }))
                      .filter(p => isFinite(p.v));
    if (pts.length < 2) return null;
    const W = 78, H = 24, pad = 3;
    const vals = pts.map(p => p.v);
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const span = (max - min) || 1;
    const x = i => pad + i * (W - 2 * pad) / (pts.length - 1);
    const y = v => H - pad - (v - min) / span * (H - 2 * pad);
    let poly = "";
    pts.forEach((p, i) => { poly += (i ? " " : "") + x(i).toFixed(1) + "," + y(p.v).toFixed(1); });
    let dots = "";
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      if (!p.ab && !last) return;
      const col = p.ab ? "var(--crit)" : "var(--accent)";
      dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (last ? 2.6 : 2) + '" fill="' + col + '"/>';
    });
    const wrap = el("span", "spark");
    wrap.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">' +
      '<polyline points="' + poly + '" fill="none" stroke="var(--accent)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + '</svg>';
    return wrap;
  }

  // T5: full-size trend chart for the lab_trend chip card. Same hand-rolled
  // inline-SVG approach as sparkline() — no chart library, themed via the
  // existing CSS custom properties. `points` are LabResult-shaped
  // ({value, date, abnormal}) already sorted ASC by the /labs/trend endpoint.
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function trendChart(points) {
    const pts = (points || [])
      .map(p => ({ v: numify(p.value), ab: !!p.abnormal, date: p.date || "" }))
      .filter(p => isFinite(p.v));
    if (pts.length < 2) return null;
    const W = 300, H = 120, padL = 36, padR = 12, padT = 16, padB = 18;
    const vals = pts.map(p => p.v);
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const span = (max - min) || 1;
    const x = i => padL + i * (W - padL - padR) / (pts.length - 1);
    const y = v => padT + (H - padT - padB) * (1 - (v - min) / span);
    const fmt = v => (Math.abs(v) >= 100 || v === Math.round(v)) ? String(Math.round(v)) : String(Math.round(v * 10) / 10);
    let poly = "";
    pts.forEach((p, i) => { poly += (i ? " " : "") + x(i).toFixed(1) + "," + y(p.v).toFixed(1); });
    let dots = "";
    pts.forEach((p, i) => {
      const last = i === pts.length - 1;
      const col = p.ab ? "var(--crit)" : "var(--accent)";
      dots += '<circle cx="' + x(i).toFixed(1) + '" cy="' + y(p.v).toFixed(1) + '" r="' + (last ? 3.4 : 2.6) + '" fill="' + col + '"/>';
    });
    const last = pts[pts.length - 1];
    // Latest-value label: sits above its dot, clamped inside the frame.
    const lvX = Math.min(x(pts.length - 1), W - padR).toFixed(1);
    const lvY = Math.max(y(last.v) - 8, 10).toFixed(1);
    const txt = 'font-family="inherit" font-size="9.5"';
    const svg =
      '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet" role="img" aria-label="trend chart">' +
      '<line x1="' + padL + '" y1="' + y(max).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y(max).toFixed(1) + '" stroke="var(--hair)" stroke-width="1"/>' +
      '<line x1="' + padL + '" y1="' + y(min).toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y(min).toFixed(1) + '" stroke="var(--hair)" stroke-width="1"/>' +
      '<text x="' + (padL - 5) + '" y="' + (y(max) + 3).toFixed(1) + '" text-anchor="end" ' + txt + ' fill="var(--muted)">' + fmt(max) + '</text>' +
      '<text x="' + (padL - 5) + '" y="' + (y(min) + 3).toFixed(1) + '" text-anchor="end" ' + txt + ' fill="var(--muted)">' + fmt(min) + '</text>' +
      '<polyline points="' + poly + '" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots +
      '<text x="' + lvX + '" y="' + lvY + '" text-anchor="end" ' + txt + ' font-weight="700" fill="' + (last.ab ? "var(--crit)" : "var(--text)") + '">' + fmt(last.v) + '</text>' +
      '<text x="' + padL + '" y="' + (H - 5) + '" ' + txt + ' fill="var(--faint)">' + esc(pts[0].date) + '</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 5) + '" text-anchor="end" ' + txt + ' fill="var(--faint)">' + esc(last.date) + '</text>' +
      '</svg>';

  // ================= DASHBOARD CARD BUILDERS =================

  // ---- Alerts ----
  function metricStatusLabelForName(name, metrics) {
    const n = (name || "").toLowerCase();
    for (const m of metrics) {
      if (m.key && n.indexOf(m.key.toLowerCase()) !== -1 && m.status_label) return m.status_label;
    }
    return null;
  }
  function metricStatusLabelByKey(key, metrics) {
    for (const m of metrics) if (m.key === key) return m.status_label;
    return null;
  }
  function deriveAlertTitle(f, metrics) {
    const msg = f.message || "";
    if (f.kind === "allergy_interaction") return "Allergy Conflict";
    if (f.kind === "drug_drug") return "Drug Interaction";
    let m;
    if ((m = msg.match(/^Abnormal lab:\s*(.+?)\s*=/i))) {
      const nm = m[1].trim();
      return nm + " — " + (metricStatusLabelForName(nm, metrics) || "Abnormal");
    }
    if ((m = msg.match(/^Rising trend in\s*(.+?)\s*:/i))) {
      return m[1].trim() + " — Rising";
    }
    if (/blood pressure/i.test(msg)) {
      return "Blood Pressure — " + (metricStatusLabelByKey("bp", metrics) || "High");
    }
    if (/heart rate/i.test(msg)) {
      return "Heart Rate — " + (metricStatusLabelByKey("hr", metrics) || "Abnormal");
    }
    return (f.kind || "alert").replace(/_/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
  }
  function buildAlertCard(f, metrics) {

  // ---- Metric cards ----
  function metricSpark(metric) {
    const hist = Array.isArray(metric.history) ? metric.history : [];
    if (hist.length < 2) return null;
    const abnormal = metric.status && metric.status !== "normal";
    const series = hist.map((p, i) => ({ value: p.value, abnormal: abnormal && i === hist.length - 1 }));
    return sparkline(series);
  }
  function metricDetail(metric) {
    const inner = el("div");
    const sp = metricSpark(metric);
    if (sp) { const w = el("div", "m-spark"); w.appendChild(sp); inner.appendChild(w); }
    const hist = Array.isArray(metric.history) ? metric.history : [];
    const abnormal = metric.status && metric.status !== "normal";
    hist.slice().reverse().forEach((p, idx) => {
      const r = el("div", "hist-row");
      r.appendChild(el("span", null, p.date || "—"));
      const hv = el("span", "hv" + (abnormal && idx === 0 ? " ab" : ""));
      hv.textContent = p.value + (metric.unit ? " " + metric.unit : "");
      r.appendChild(hv);
      inner.appendChild(r);
    });
    const c = sourceChip(metric.source);
    if (c) { const cc = el("div", "cites m-cite"); cc.appendChild(c); inner.appendChild(cc); }
    return inner;
  }
  function buildMetricCard(metric, large) {

  function initials(name) {
    if (!name) return "?";

  function renderHeader(snap) {

  function renderDashboard(snap) {
    dash.innerHTML = "";

  function renderAssistant(resp, node) {
    const turn = el("div", "turn assistant");
    const bubble = el("div", "bubble");
    let content = false;

    if (resp.degraded) {
      const d = el("div", "degraded");
      d.appendChild(el("div", null, "⚠ Partial briefing — some data unavailable"));
      if (resp.notes) d.appendChild(el("div", "n", resp.notes));
      bubble.appendChild(d); content = true;
    }

    // Register guideline metadata BEFORE building chips, so a gl chip inside a
    // mixed briefing claim can already resolve its popover content.
    registerGlMeta(resp.briefing);
    registerGlMeta(resp.guideline_evidence);

    if (Array.isArray(resp.briefing) && resp.briefing.length) {
      resp.briefing.forEach(c => {
        const cl = el("div", "claim");
        cl.appendChild(el("p", "claim-text", c.text || ""));
        const ct = makeCites(c.source_refs); if (ct) cl.appendChild(ct);
        bubble.appendChild(cl);
      });
      content = true;
    }

    // Week 2: guideline evidence — reference knowledge under its OWN header,
    // never mixed into the patient briefing (verifier separation rule §6.3).
    if (Array.isArray(resp.guideline_evidence) && resp.guideline_evidence.length) {
      const sec = el("div", "gl-section");
      const head = el("div", "gl-head");
      head.appendChild(el("span", null, "📖"));
      head.appendChild(el("span", null, "Guideline evidence"));
      sec.appendChild(head);
      sec.appendChild(el("div", "gl-sub", "Reference knowledge — not this patient's chart."));
      resp.guideline_evidence.forEach(c => {
        const cl = el("div", "gl-claim");
        cl.appendChild(el("div", null, c.text || ""));
        const ct = makeCites(c.source_refs); if (ct) cl.appendChild(ct);
        sec.appendChild(cl);
      });
      bubble.appendChild(sec); content = true;
    }

    if (Array.isArray(resp.constraint_flags) && resp.constraint_flags.length) {
      resp.constraint_flags.forEach(f => {
        const sev = (f.severity === "critical" || f.severity === "warning") ? f.severity : "info";
        const line = el("div", "flagline " + sev);
        line.style.marginTop = "10px";
        line.appendChild(el("div", "fkind", (f.kind || sev).replace(/_/g, " ")));
        line.appendChild(el("div", "fmsg", f.message || ""));
        const ct = makeCites(f.source_refs); if (ct) line.appendChild(ct);
        bubble.appendChild(line);
      });
      content = true;
    }

    const qList = Array.isArray(resp.quarantined_claims) ? resp.quarantined_claims : [];
    const qCount = resp.quarantined_count || qList.length;
    if (qList.length || qCount > 0) {
      const q = el("div", "qbox");
      q.appendChild(el("div", "qhead", "⚠ Unverified — needs chart review (not shown as fact)"));
      if (qList.length) {

          item.appendChild(el("div", null, qc.text || ""));
          const ct = makeCites(qc.source_refs); if (ct) item.appendChild(ct);
          q.appendChild(item);
        });
      } else {
        q.appendChild(el("div", "qclaim", qCount + " claim(s) withheld pending chart review."));
      }
      bubble.appendChild(q); content = true;
    }

    if (resp.notes && !resp.degraded) { bubble.appendChild(el("div", "notes-line", resp.notes)); content = true; }
